version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./server
    container_name: mern-backend
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017/my_mern_app

  frontend:
    build:
      context: ./task-manager
      args:
        REACT_APP_API_URL: http://localhost:5000
    container_name: mern-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data: